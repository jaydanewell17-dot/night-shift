<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Night Shift — Build 1</title><link rel="stylesheet" href="style.css">

<body><div id="game-shell"><div id="hud"><div class="brand">NIGHT SHIFT</div><div class="time-wrap"><span>SHIFT</span><strong id="clock">10:00 PM</strong></div></div><main id="game">

<rect class="door-frame" x="535" y="700" width="130" height="18"/><rect class="glass-door" x="555" y="675" width="90" height="43"/><line class="door-line" x1="600" y1="675" x2="600" y2="718"/>
<g class="shelf obstacle"><rect x="130" y="100" width="230" height="72"/><rect class="shelf-top" x="140" y="108" width="210" height="12"/><line x1="140" y1="144" x2="350" y2="144"/></g>
<g class="shelf obstacle"><rect x="130" y="245" width="230" height="72"/><rect class="shelf-top" x="140" y="253" width="210" height="12"/><line x1="140" y1="289" x2="350" y2="289"/></g>
<g class="shelf obstacle"><rect x="470" y="100" width="230" height="72"/><rect class="shelf-top" x="480" y="108" width="210" height="12"/><line x1="480" y1="144" x2="690" y2="144"/></g>
<g class="shelf obstacle"><rect x="470" y="245" width="230" height="72"/><rect class="shelf-top" x="480" y="253" width="210" height="12"/><line x1="480" y1="289" x2="690" y2="289"/></g>

<g class="counter obstacle"><rect x="810" y="350" width="260" height="105" rx="4"/><rect class="counter-top" x="800" y="340" width="280" height="18" rx="3"/><rect class="register-screen" x="900" y="365" width="58" height="38"/><rect class="register-base" x="913" y="403" width="32" height="14"/><text x="935" y="438" text-anchor="middle">REGISTER</text></g>

</svg><div id="controls"><span><b>WASD</b> / <b>ARROWS</b> MOVE</span><span><b>E</b> INTERACT</span></div><div id="message"></div>
</main></div><script src="game.js"></script></body></html>
